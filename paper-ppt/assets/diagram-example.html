<!--
  diagram-example.html — 三张自绘示意图，用来演示"用 HTML + inline SVG 画图"。

  为什么不用 pptx 原生线条：直线要手动给两个端点，框一动线就偏；SVG 里先把
  盒子中心算出来，线从中心连到中心，框永远在线上面，怎么挪都不会错位。

  用法：
    python scripts/diagram.py assets/diagram-example.html --out figs/p07.png \
      --width 1213 --height 250 --scale 2
  页面自己就是 1213×250（1 px = 0.01 inch，因此 21px 字 ≈ 15pt）。
  颜色取自 styles/domestic/tokens.json；改主色只改 :root 里的变量。
-->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root{
    --primary:#1F4E79; --primary-light:#DCE6F1; --text:#1A1A1A;
    --body:#262626; --muted:#6B6B6B; --rule:#D9D9D9; --frame:#F2F2F2;
  }
  html,body{margin:0;padding:0;background:#fff;}
  body{width:1213px;height:250px;font-family:"Microsoft YaHei","Arial",sans-serif;color:var(--body);}
  .row{display:flex;height:100%;}
  .panel{width:404px;height:250px;position:relative;box-sizing:border-box;padding:0;}
  h3{font-size:21px;line-height:26px;margin:10px 0 0;font-weight:700;color:var(--text);}
  h3 .num{color:var(--text);}
  .accent h3{color:var(--primary);}
  .note{position:absolute;left:0;right:0;bottom:8px;font-size:12.5px;color:var(--muted);text-align:center;}
  svg{display:block;}
  .box{fill:#fff;stroke:#BFBFBF;stroke-width:1.2;}
  .box-soft{fill:#fff;stroke:var(--rule);stroke-width:1.2;}
  .box-blue{fill:var(--primary-light);stroke:var(--primary);stroke-width:1.2;}
  .bar{fill:var(--primary);}
  .wire{stroke:#C9D3DD;stroke-width:1.2;fill:none;}
  .arrow{stroke:#9FB4C9;stroke-width:1.2;fill:none;}
  .t{font-size:13px;fill:var(--body);text-anchor:middle;dominant-baseline:middle;}
  .t-sm{font-size:12px;fill:var(--muted);text-anchor:middle;dominant-baseline:middle;}
  .t-bar{font-size:13.5px;fill:#fff;font-weight:700;text-anchor:middle;dominant-baseline:middle;}
  .t-accent{font-size:13.5px;fill:var(--primary);font-weight:700;text-anchor:middle;dominant-baseline:middle;}
</style>
</head>
<body>
<div class="row">

  <!-- ① 传统 CDN：层级树 -------------------------------------------------->
  <div class="panel" id="p1">
    <h3><span class="num">①</span> 传统 CDN：层级树</h3>
    <svg id="tree" width="404" height="180"></svg>
  </div>

  <!-- ② 纯 P2P：对等自治 -------------------------------------------------->
  <div class="panel" id="p2">
    <h3><span class="num">②</span> 纯 P2P：对等自治</h3>
    <svg id="mesh" width="404" height="180"></svg>
  </div>

  <!-- ③ HyperEdge：扁平 + 集中 -------------------------------------------->
  <div class="panel accent" id="p3">
    <h3><span class="num">③</span> HyperEdge：扁平 + 集中</h3>
    <svg id="flat" width="404" height="180"></svg>
    <div class="note">Hdevice（扁平对等，10 万台量级）</div>
  </div>

</div>

<script>
const NS = 'http://www.w3.org/2000/svg';
function el(name, attrs, parent) {
  const node = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (parent) parent.appendChild(node);
  return node;
}
function box(parent, x, y, w, h, cls) {
  el('rect', {x, y, width: w, height: h, rx: 4, class: cls}, parent);
}
function text(parent, x, y, value, cls) {
  const t = el('text', {x, y, class: cls}, parent);
  t.textContent = value;
}
function wire(parent, x1, y1, x2, y2) {
  el('line', {x1, y1, x2, y2, class: 'wire'}, parent);
}

/* ① 层级树：source -> 3 caches -> 6 edges. Anchor lines on box centres so a
   connector can never drift away from the shape it belongs to. */
(function tree() {
  const svg = document.getElementById('tree');
  const W = 404, cx = W / 2;
  const sw = 104, sh = 32, cw = 92, ch = 30, ew = 58, eh = 26;
  const cy = 58, ccy = 112, eey = 162;
  const cxs = [cx - 120, cx, cx + 120];

  // wires first: they must sit behind the boxes
  cxs.forEach((x) => {
    wire(svg, cx, cy + sh / 2, x, ccy - ch / 2);
    [x - 34, x + 34].forEach((ex) => wire(svg, x, ccy + ch / 2, ex, eey - eh / 2));
  });

  box(svg, cx - sw / 2, cy - sh / 2, sw, sh, 'box');
  text(svg, cx, cy, '源站', 't');

  cxs.forEach((x) => {
    box(svg, x - cw / 2, ccy - ch / 2, cw, ch, 'box-soft');
    text(svg, x, ccy, '缓存层', 't');
    [x - 34, x + 34].forEach((ex) => {
      box(svg, ex - ew / 2, eey - eh / 2, ew, eh, 'box-soft');
      text(svg, ex, eey, '边缘', 't-sm');
    });
  });
})();

/* ② 网状：六个 peer，连边按中心点算，圆画在线上方 */
(function mesh() {
  const svg = document.getElementById('mesh');
  const nodes = [
    [102, 52], [202, 44], [302, 56],
    [118, 136], [202, 148], [294, 132],
  ];
  const edges = [[0, 1], [1, 2], [0, 3], [1, 4], [2, 5], [3, 4], [4, 5], [0, 4], [2, 4], [1, 3], [1, 5]];
  edges.forEach(([a, b]) => wire(svg, nodes[a][0], nodes[a][1], nodes[b][0], nodes[b][1]));
  nodes.forEach(([x, y]) => el('circle', {cx: x, cy: y, r: 14, fill: '#fff', stroke: '#BFBFBF', 'stroke-width': 1.2}, svg));
})();

/* ③ 扁平 + 集中：Tracker 统一分配，箭头从条带底边垂直落到设备顶边 */
(function flat() {
  const svg = document.getElementById('flat');
  const barW = 356, barX = 24, barY = 46, barH = 34;
  const n = 5, bw = 46, bh = 26, by = 132, gap = (barW - n * bw) / (n + 1);

  el('defs', {}, svg).innerHTML =
    '<marker id="head" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto">' +
    '<path d="M0,0 L8,4 L0,8 z" fill="#9FB4C9"/></marker>';

  for (let i = 0; i < n; i++) {
    const bx = barX + gap * (i + 1) + bw * i;
    el('line', {
      x1: bx + bw / 2, y1: barY + barH, x2: bx + bw / 2, y2: by - 2,
      class: 'arrow', 'marker-end': 'url(#head)',
    }, svg);
    box(svg, bx, by, bw, bh, 'box-blue');
  }

  box(svg, barX, barY, barW, barH, 'bar');
  text(svg, barX + barW / 2, barY + barH / 2, 'Tracker（全局视野）', 't-bar');
})();
</script>
</body>
</html>
